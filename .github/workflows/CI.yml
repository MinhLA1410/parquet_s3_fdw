name: Parquet S3 FDW test

on:
  workflow_dispatch:
  pull_request:  
  push:
    branches:
      - master
      - main
jobs:
  detect-pgversion:
    runs-on: ubuntu-22.04
    outputs:
      pgversion: ${{ steps.detect-pgversion.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      
      - name: detect-pgversion
        id: detect-pgversion
        run: |
          targets=`bash GitHubActions/detect_targets.sh`
          echo "targets=$targets" >> $GITHUB_OUTPUT

  test:
    needs: detect-pgversion
    env:
      AWS_SDK_CPP : "1.11.335"
      ARROW: "16.1.0"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    strategy:
      fail-fast: false
      matrix:
        pg: ${{ fromJSON(needs.detect-pgversion.outputs.pgversion) }}
        
    name: Test on PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: tar
        run: tar zcvf parquet_s3_fdw.tar.gz ./*

      - name: set_proxy
        run: bash GitHubActions/env.sh

      - name: install AWS SDK CPP for S3
        run: bash GitHubActions/install_aws_sdk_cpp.sh ${{ env.AWS_SDK_CPP }}

      - name: install ARROW
        run: bash GitHubActions/install_arrow.sh ${{ env.ARROW }}

      - name: install locales
        run: bash GitHubActions/install_locales.sh

      - name: build PostgreSQL ${{ matrix.pg }}
        run: bash GitHubActions/build_postgres.sh ${{ matrix.pg }}

      - name: build parquet_s3_fdw
        run: bash GitHubActions/build_parquet_s3_fdw.sh ${{ matrix.pg }} }}

      - name: execute parquet_s3_fdw test
        run: bash GitHubActions/execute_test.sh ${{ matrix.pg }} }}

      - name: download output files (regression.diffs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pg }}-${{ matrix.config }}-test-results
          path: |
            workdir/postgresql-${{ matrix.pg }}/contrib/parquet_s3_fdw/regression.diffs
            workdir/postgresql-${{ matrix.pg }}/contrib/parquet_s3_fdw/regression.out
            workdir/postgresql-${{ matrix.pg }}/contrib/parquet_s3_fdw/results
          retention-days: 7

